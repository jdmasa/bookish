---
title: My Book Title
author: Your Name
rights: All rights reserved
lang: en-US
mainlang: english
otherlang: english
tags: [pandoc, ebook]
abstract: |
  A short summary of the book, shown in EPUB metadata and some e-readers.
mainfont: DejaVu Sans
linkReferences: true
# book + openany/oneside: proper chapter breaks (each chapter starts on its
# own page) without the print-book convention of forcing chapters onto
# right-hand pages (which would insert extra blank pages unpredictably).
documentclass: book
classoption: [openany, oneside]
# Make both the title text and the page number clickable in the PDF's table
# of contents (hyperref's default only links the title text).
hyperrefoptions: [linktoc=all]
# Optional full-page cover image on the PDF's very first page (the EPUB gets
# its cover separately, via --epub-cover-image in the Makefile). Remove to
# omit it.
# cover-image: images/cover.png
# Closing "colophon" stamp on the PDF's back-of-book page, right below the
# table of contents: a QR code (e.g. linking to a copyright registration or
# verification page) next to a license badge image. Both must be set for
# either to render. Set to blank/remove to omit the stamp entirely. The EPUB
# gets the same two images via backmatter/colophon.md instead (see README).
qr-image: images/qr.png
license-badge-image: images/license-badge.png
---
