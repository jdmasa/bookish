name: Build and publish release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pandoc/latex:latest

    steps:
      - name: Install build dependencies
        run: apk add --no-cache git openssh-client make ttf-dejavu

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build epub and pdf
        run: make epub pdf

      - name: Attach books to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/epub/book.epub
            build/pdf/book.pdf
